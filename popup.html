<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Form Find & Replace</title>
  </head>
  <body>
    <header>
      <h1>Form Find &amp; Replace</h1>
      <button id="addRule" class="ghost" type="button" title="Добавить правило">
        + Правило
      </button>
    </header>

    <p class="hint">
      Задай пары «найти → заменить». «Найти» покажет счёт совпадений и что
      найдено; «Заменить» применит изменения.
    </p>

    <div id="rules" class="rules"></div>

    <div id="empty" class="empty">Правил пока нет. Добавь первое.</div>

    <div id="results" class="results" hidden></div>

    <div id="status" class="status" role="status"></div>

    <footer>
      <button id="find" class="primary" type="button">Найти</button>
      <button id="replace" class="secondary" type="button" disabled>
        Заменить
      </button>
      <button id="clear" class="ghost" type="button">Очистить все</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
